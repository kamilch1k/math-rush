name = "math-rush-link"
account_id = "56b290855a9df9c3d3f0391561b7e4b1"
main = "src/index.js"
compatibility_date = "2026-09-09"

[assets]
directory = "../outputs"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "math-rush-platform"
database_id = "aab5205d-ab29-4494-bfdf-95494809c4d8"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
