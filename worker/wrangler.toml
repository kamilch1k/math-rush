name = "math-rush-link"
main = "src/index.js"
compatibility_date = "2026-09-09"

[assets]
directory = "../outputs"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "math-rush-platform"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1
