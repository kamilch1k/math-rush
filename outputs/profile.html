<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>Профиль — Math Rush</title><link rel="stylesheet" href="app-shell.css"><style>.category-row{display:grid;grid-template-columns:130px 1fr 50px;gap:12px;align-items:center;margin:14px 0}.category-row strong:last-child{text-align:right}.skill-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.skill-box{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.skill-box ul{margin:0;padding:0;list-style:none}.skill-box li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f1f3}@media(max-width:700px){.skill-columns{grid-template-columns:1fr}.category-row{grid-template-columns:95px 1fr 42px}}</style></head>
<body><main class="page">
  <nav class="site-nav" aria-label="Главная навигация"><a class="brand" href="math-rush.html">Math Rush</a><div class="nav-links"><a href="math-rush.html">Задачи</a><a href="math-map.html">Карта</a><a class="active" href="profile.html">Профиль</a><a href="settings.html">Настройки</a></div></nav>
  <header class="hero"><p class="eyebrow">Профиль ученика</p><h1 id="levelTitle">Уровень 1</h1><p class="lead"><strong id="xpText">0 XP</strong> · <span id="streakText">🔥 Серия: 0 дней</span></p></header>
  <section class="panel"><h2>Статистика</h2><div class="grid stats-grid"><div class="stat-card"><span>Решено задач</span><strong id="attempts">0</strong></div><div class="stat-card"><span>Правильных</span><strong id="correct">0</strong></div><div class="stat-card"><span>Точность</span><strong id="accuracy">0%</strong></div><div class="stat-card"><span>Освоено тем</span><strong id="mastered">0</strong></div></div></section>
  <section class="panel"><h2>Прогресс по направлениям</h2><div id="categories"></div></section>
  <section class="panel"><div class="skill-columns"><div class="skill-box"><h2>Сильные навыки</h2><ul id="strongSkills"></ul></div><div class="skill-box"><h2>Стоит повторить</h2><ul id="reviewSkills"></ul></div></div></section>
</main><script src="progress.js"></script><script>(()=>{const p=MathRushProgress,d=p.load(),attempts=d.attempts.length,correct=d.attempts.filter(a=>a.isCorrect).length;document.getElementById('levelTitle').textContent=`Уровень ${p.levelForXp(d.totalXp)}`;document.getElementById('xpText').textContent=`${d.totalXp} XP`;document.getElementById('streakText').textContent=`🔥 Серия: ${d.streakDays||0} дней`;document.getElementById('attempts').textContent=attempts;document.getElementById('correct').textContent=correct;document.getElementById('accuracy').textContent=`${attempts?Math.round(correct/attempts*100):0}%`;const ranked=p.skills.map(skill=>({skill,mastery:p.masteryFor(skill.id,d)}));document.getElementById('mastered').textContent=ranked.filter(x=>x.mastery>=80).length;const names={arithmetic:'Арифметика',algebra:'Алгебра',geometry:'Геометрия'};Object.entries(names).forEach(([id,name])=>{const value=p.categorySummary(id,d).mastery;document.getElementById('categories').insertAdjacentHTML('beforeend',`<div class="category-row"><strong>${name}</strong><div class="progress-track"><span style="width:${value}%"></span></div><strong>${value}%</strong></div>`)});const item=x=>`<li><span>${x.mastery>=80?'✓':'⚠'} ${x.skill.title}</span><strong>${x.mastery}%</strong></li>`;const practiced=ranked.filter(x=>(d.skills[x.skill.id]?.attempts||0)>0);document.getElementById('strongSkills').innerHTML=(practiced.sort((a,b)=>b.mastery-a.mastery).slice(0,4).map(item).join('')||'<li class="muted">Реши первые задачи — здесь появятся сильные темы.</li>');document.getElementById('reviewSkills').innerHTML=(practiced.sort((a,b)=>a.mastery-b.mastery).slice(0,4).map(item).join('')||'<li class="muted">Пока нечего повторять.</li>')})();</script></body></html>
