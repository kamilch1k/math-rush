<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>Производные — Math Rush</title><link rel="stylesheet" href="app-shell.css"><style>
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.problem{padding:22px;border:1px solid #d6d2ff;border-radius:18px;background:#f7f6ff;text-align:center;font-size:clamp(27px,5vw,46px);font-weight:950;letter-spacing:-.04em}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.tool{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-weight:800;cursor:pointer}.tool.active{border-color:var(--accent);color:var(--accent-dark);background:#eeecff}.board-wrap{position:relative;border:2px solid #d0d5dd;border-radius:18px;background:#fff;overflow:hidden}.board{display:block;width:100%;height:380px;touch-action:none;cursor:crosshair}.board-note{position:absolute;left:15px;top:12px;color:#98a2b3;font-size:12px;pointer-events:none}.side-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.side-card label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:800}.side-card select,.text-answer{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.side-card .button{width:100%;margin-top:10px}.feedback{min-height:48px;margin:14px 0 0;padding:12px 14px;border-radius:13px;background:#f9fafb;font-weight:750}.feedback.good{color:var(--good);background:#ecfdf3}.feedback.bad{color:#b42318;background:#fef3f2}.fallback{margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.recognized{display:block;margin-top:5px;color:var(--muted);font-size:12px}@media(max-width:760px){.lesson{grid-template-columns:1fr}.board{height:300px}.side-card{order:-1}}

<header class="hero"><p class="eyebrow">Алгебра · рукописная практика</p><h1>Производные</h1><p class="lead">Решай на доске мышью, пальцем или стилусом. Рисунок сохраняется при повороте экрана и изменении размера.</p></header>
<section class="panel lesson"><div><div id="problem" class="problem"></div><div class="toolbar"><button class="tool active" data-tool="pen">✏ Ручка</button><button class="tool" data-tool="eraser">⌫ Ластик</button><button id="undo" class="tool">↶ Undo</button><button id="redo" class="tool">↷ Redo</button><button id="clear" class="tool">Очистить</button></div><div class="board-wrap"><span class="board-note">Напиши f′(x)</span><canvas id="board" class="board"></canvas></div></div><aside class="side-card"><label for="level">Уровень</label><select id="level"><option value="1">1 · Степенная функция</option><option value="2">2 · Многочлены</option><option value="3">3 · Отрицательные степени</option></select><button id="checkDrawing" class="button">Проверить рисунок</button><div id="feedback" class="feedback" role="status">Напиши производную на доске.</div><div id="fallback" class="fallback" hidden><label for="textAnswer">Ответ текстом</label><input id="textAnswer" class="text-answer" placeholder="например: 12x^3 + 4x"><button id="checkText" class="button secondary">Проверить текст</button></div></aside></section>
</main><script src="progress.js"></script><script src="derivatives.js"></script><script>
(()=>{const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),strokes=[],redoStack=[];let drawing=null,tool='pen',problem,startedAt=Date.now();const feedback=document.getElementById('feedback'),fallback=document.getElementById('fallback'),textAnswer=document.getElementById('textAnswer');function size(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}function drawStroke(stroke){if(stroke.points.length<1)return;ctx.save();ctx.globalCompositeOperation=stroke.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle='#101828';ctx.lineWidth=stroke.tool==='eraser'?24:Math.max(2.5,3.5*(stroke.points[0].pressure||.5));ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();stroke.points.forEach((p,i)=>{const x=p.x*canvas.clientWidth,y=p.y*canvas.clientHeight;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.restore()}function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);strokes.forEach(drawStroke)}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,pressure:e.pressure||.5}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drawing={tool,points:[point(e)]};strokes.push(drawing);redoStack.length=0;drawStroke(drawing)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;drawing.points.push(point(e));redraw()});function end(){drawing=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.querySelectorAll('[data-tool]').forEach(button=>button.addEventListener('click',()=>{tool=button.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===button))}));document.getElementById('undo').onclick=()=>{if(strokes.length)redoStack.push(strokes.pop());redraw()};document.getElementById('redo').onclick=()=>{if(redoStack.length)strokes.push(redoStack.pop());redraw()};document.getElementById('clear').onclick=()=>{strokes.length=0;redoStack.length=0;redraw()};function next(){problem=MathRushDerivatives.generate(Number(document.getElementById('level').value));document.getElementById('problem').textContent=problem.text;textAnswer.value='';strokes.length=0;redoStack.length=0;redraw();feedback.className='feedback';feedback.textContent='Напиши производную на доске.';fallback.hidden=true;startedAt=Date.now()}document.getElementById('level').onchange=next;document.getElementById('checkDrawing').onclick=()=>{if(!strokes.some(s=>s.tool==='pen'&&s.points.length>1)){feedback.className='feedback bad';feedback.textContent='Сначала напиши решение на доске.';return}feedback.className='feedback';feedback.textContent='Автопроверка рисунка пока недоступна. Введи итоговый ответ текстом.';fallback.hidden=false;textAnswer.focus()};function checkText(){const value=textAnswer.value;if(MathRushDerivatives.equivalent(value,problem.answer)){feedback.className='feedback good';feedback.innerHTML=`✓ Верно<span class="recognized">Ответ: ${problem.displayAnswer}</span>`;MathRushProgress.recordAttempt('derivatives-whiteboard',true,Date.now()-startedAt,document.getElementById('level').value==='1'?'simple':document.getElementById('level').value==='2'?'advanced':'expert');setTimeout(next,850)}else{feedback.className='feedback bad';feedback.textContent='Пока нет. Проверь коэффициент и уменьшение степени на 1.';MathRushProgress.recordAttempt('derivatives-whiteboard',false,Date.now()-startedAt,'simple')}}document.getElementById('checkText').onclick=checkText;textAnswer.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();checkText()}});new ResizeObserver(size).observe(canvas);next()})();
</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"91aa493b474347388ef5d1aae6058937"}'></script></body></html>
