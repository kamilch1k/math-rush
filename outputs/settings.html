<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fb"><title>Настройки — Math Rush</title><link rel="stylesheet" href="app-shell.css"><style>.settings-form{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.setting-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.setting-card label,.setting-card strong{display:block}.setting-card label{margin-bottom:7px;color:var(--muted);font-size:12px;font-weight:800}.setting-card select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.switch{display:flex!important;align-items:center;justify-content:space-between;gap:12px;color:var(--ink)!important;font-size:15px!important}.switch input{width:20px;height:20px;accent-color:var(--accent)}.save-note{margin-top:14px;color:var(--good);font-weight:800}@media(max-width:700px){.settings-form{grid-template-columns:1fr}}</style></head><body><main class="page">
<nav class="site-nav"><a class="brand" href="math-rush.html">Math Rush</a><div class="nav-links"><a href="math-rush.html">Задачи</a><a href="math-map.html">Карта</a><a href="profile.html">Профиль</a><a class="active" href="settings.html">Настройки</a></div></nav>
<header class="hero"><p class="eyebrow">Персонализация</p><h1>Настройки</h1><p class="lead">Эти параметры сохраняются на устройстве и применяются к новым тренировкам.</p></header>
<section class="panel"><div class="settings-form"><div class="setting-card"><label for="language">Язык</label><select id="language"><option value="ru">Русский</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option></select></div><div class="setting-card"><label for="timer">Время по умолчанию</label><select id="timer"><option>30</option><option>40</option><option>60</option><option selected>90</option><option>120</option><option>180</option><option>240</option><option>300</option></select></div><div class="setting-card"><label class="switch" for="sound"><span>Звуки ответов</span><input id="sound" type="checkbox" checked></label></div><div class="setting-card"><strong>Распознавание рукописи</strong><p class="muted" style="margin:7px 0 0">Будет подключено через защищённый серверный API. Ключ никогда не попадёт в браузер.</p></div></div><p id="saved" class="save-note" aria-live="polite"></p></section>
</main><script>(()=>{const key='mathRushPreferencesV1',defaults={language:'ru',timer:90,sound:true};let prefs=defaults;try{prefs={...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(_){}const language=document.getElementById('language'),timer=document.getElementById('timer'),sound=document.getElementById('sound'),saved=document.getElementById('saved');language.value=prefs.language;timer.value=String(prefs.timer);sound.checked=prefs.sound!==false;function save(){prefs={language:language.value,timer:Number(timer.value),sound:sound.checked};localStorage.setItem(key,JSON.stringify(prefs));saved.textContent='✓ Настройки сохранены';setTimeout(()=>saved.textContent='',1200)}[language,timer,sound].forEach(x=>x.addEventListener('change',save))})();</script><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"91aa493b474347388ef5d1aae6058937"}'></script></body></html>
