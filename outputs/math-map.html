<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f6fb">
  <title>Карта математики — Math Rush</title>
  <link rel="stylesheet" href="app-shell.css">
  <style>
    html,body{height:100%}
    body{overflow:hidden;overscroll-behavior:none}
    .map-page-fullscreen { max-width: 1400px; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; padding-top:12px; padding-bottom:12px; }
    .map-page-fullscreen .site-nav{position:static;flex:0 0 auto;margin-bottom:12px}
    .map-board-shell{position:relative;flex:1 1 auto;min-height:0;height:auto;margin-top:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle at 50% 0%,rgba(99,91,255,.10),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,247,255,.92));box-shadow:0 12px 30px rgba(16,24,40,.06);overscroll-behavior:none}
    .map-board-shell .board-viewport{position:absolute;inset:0;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none;background:transparent}
    .map-hud{position:absolute;z-index:6;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 10px 28px rgba(16,24,40,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .18s ease,transform .18s ease}
    .map-canvas-head{position:relative;z-index:2;display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:12px 16px;align-items:start;padding-right:208px;margin-bottom:20px}
    .map-canvas-head h1{margin:0;font-size:22px}
    .map-canvas-head .lead{margin:4px 0 8px;font-size:12px;line-height:1.4}
    .map-canvas-stats{display:flex;gap:4px;padding:8px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(16,24,40,.08);justify-self:center}
    .map-canvas-stats .board-stat{border:0;box-shadow:none;background:transparent;padding:4px 10px;min-width:78px;text-align:center}
    .map-canvas-stats .board-stat + .board-stat{border-left:1px solid var(--line);border-radius:0}
    .map-reset-btn{position:absolute;z-index:7;left:12px;bottom:12px;width:52px;height:52px;padding:0;border:0;border-radius:15px;color:#fff;background:var(--accent);font-size:25px;font-weight:900;line-height:1;box-shadow:0 12px 28px rgba(99,91,255,.4);transition:transform .15s ease,background .15s ease}
    .map-reset-btn:hover{background:var(--accent-dark);transform:translateY(-2px)}
    .map-reset-btn:active{transform:translateY(1px)}
    .board-viewport{position:relative;overflow:hidden;height:min(78vh,800px);min-height:420px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at 50% 0%,rgba(99,91,255,.10),transparent 42%),linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,247,255,.92));box-shadow:0 12px 30px rgba(16,24,40,.06);touch-action:none;overscroll-behavior:none;cursor:grab;user-select:none;-webkit-user-select:none}
    .board-viewport::before{content:'';position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle,#d9dcea 1.1px,transparent 1.4px);background-size:26px 26px;pointer-events:none}
    .board-viewport.panning{cursor:grabbing}
    .board-viewport>.branches{will-change:transform}
    .board-viewport>div[data-board-content]{padding:40px 22px 60px}
    .board-viewport .branch{position:relative;z-index:1}
    .board-viewport .root-node{margin-top:0}
    @media(min-width:1101px){.board-viewport>div[data-board-content]{min-width:1240px}}
    .board-frame{padding:0}
    .board-plaque{display:inline-flex;align-items:center;margin:0;padding:6px 12px;width:fit-content;border-radius:999px;color:var(--accent-dark);background:#eeecff;border:1px solid #d6d2ff;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .board-stats{display:flex;gap:4px;margin-bottom:0}
    .board-stat{padding:8px 12px;border-radius:12px;color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(16,24,40,.05)}
    .board-stat span{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .board-stat strong{display:block;font-size:17px;font-weight:900}
    .math-map{position:relative;padding:40px 22px 60px;border:1px solid var(--line);border-radius:28px;color:var(--ink);background:radial-gradient(circle at 50% 100%,rgba(99,91,255,.12),transparent 36%),linear-gradient(180deg,rgba(255,255,255,.96),rgba(246,247,255,.92));box-shadow:0 12px 30px rgba(16,24,40,.06)}
    .root-node{position:relative;z-index:2;width:fit-content;margin:0 auto 40px;padding:12px 34px;border-radius:999px;color:#fff;background:#635bff;box-shadow:0 8px 22px rgba(99,91,255,.35);font-size:18px;font-weight:950;letter-spacing:.14em}
    .branches{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
    .branch-title{margin:0 0 16px;padding:10px;border-radius:999px;text-align:center;font-size:14px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--branch-color);box-shadow:0 8px 22px color-mix(in srgb,var(--branch-color) 28%,transparent)}
    .branch[data-category="arithmetic"]{--branch-color:#e66b2c}
    .branch[data-category="algebra"]{--branch-color:#635bff}
    .branch[data-category="geometry"]{--branch-color:#1570ef}
    .skill-list{display:grid;gap:16px}
    .skill-node{position:relative;width:100%;padding:13px 15px;border:2px solid color-mix(in srgb,var(--branch-color) 32%,var(--line));border-radius:15px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 8px 24px rgba(16,24,40,.07)}
    .skill-node strong{display:block;font-size:14px}
    .skill-node small{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}
    .mastery-track{height:6px;margin-top:8px;border-radius:99px;background:#eaecf0;overflow:hidden}
    .mastery-track i{display:block;height:100%;background:linear-gradient(90deg,var(--branch-color),#12b76a)}
    .node-sub{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:800;color:var(--muted)}
    .skill-node .state{position:absolute;top:10px;right:10px;font-size:13px}
    .skill-node.mastered{border-color:#75d9aa;background:#ecfdf3}
    .skill-node.locked{opacity:.6}
    .req-chip{display:inline-block;margin:6px 6px 0 0;padding:2px 9px;border-radius:99px;background:#f2f4f7;color:var(--muted);font-size:10.5px;font-weight:800}
    .req-chip.cross{background:#eeecff;color:#4f46e5}
    .skill-detail.map-hud-detail{position:absolute;z-index:7;top:132px;right:12px;width:min(340px,calc(100% - 24px));max-height:calc(100% - 220px);overflow:auto;margin:0;padding:18px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 16px 44px rgba(16,24,40,.16)}
    .skill-detail.map-hud-detail:empty{display:none}
    .skill-detail{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .skill-detail h2{color:var(--ink)}
    .skill-detail .muted{color:var(--muted)}
    .detail-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
    .detail-metric{padding:10px;border-radius:12px;background:#f2f4f7}
    .detail-metric span{display:block;font-size:11px;opacity:.75}
    .detail-metric strong{font-size:20px}
    .requirements{list-style:none;margin:0;padding:0;display:grid;gap:8px}
    .requirements li{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#f2f4f7}
    @media(max-width:800px){.map-page-fullscreen{padding-top:8px;padding-bottom:8px}.branches{grid-template-columns:1fr}.map-board-shell{min-height:0}.map-canvas-head{grid-template-columns:1fr;padding-right:0}.map-canvas-head .lead{display:none}.map-canvas-stats{max-width:100%;overflow-x:auto;justify-self:stretch}.skill-detail.map-hud-detail{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:46%}}
  </style>
</head>
<body>
  <main class="page map-page-fullscreen">
    <nav class="site-nav" aria-label="Главная навигация"><a class="brand" href="math-rush.html">Math Rush</a><div class="nav-links"><a href="math-rush.html">Задачи</a><a class="active" href="math-map.html">Карта</a><a href="profile.html">Профиль</a><a href="settings.html">Настройки</a></div></nav>
    <section class="panel board-frame map-board-shell" aria-label="Карта навыков"><div class="board-viewport" data-board-viewport><div data-board-content><div class="map-canvas-head"><header><p class="eyebrow">Путь ученика</p><h1>Карта математики</h1><p class="lead">Сначала счёт по нарастающей: сложение и вычитание, умножение и деление, столбики, затем порядок действий, скобки и дроби.</p><div class="board-plaque">Математика · Карта знаний</div></header><div id="boardStats" class="map-canvas-stats board-stats"></div></div><div class="root-node">МАТЕМАТИКА</div><div id="branches" class="branches"></div></div></div><button type="button" class="map-reset-btn" data-board-home aria-label="Вернуть карту к началу" title="Вернуть карту к началу">↗</button><section id="skillDetail" class="panel skill-detail map-hud-detail" aria-live="polite"></section></section>
  </main>
  <script src="progress.js"></script>
  <script src="map-board.js"></script>
  <script>
    (() => {
      const progress = window.MathRushProgress;
      const data = progress.load();
      const categories = { arithmetic: 'АРИФМЕТИКА', algebra: 'АЛГЕБРА', geometry: 'ГЕОМЕТРИЯ' };
      const branchHost = document.getElementById('branches');
      const detail = document.getElementById('skillDetail');
      const statsHost = document.getElementById('boardStats');
      const icon = { mastered: '✓', learning: '◐', available: '●', locked: '🔒' };
      const depths = {};
      const depthOf = (id, stack = []) => {
        if (depths[id] !== undefined) return depths[id];
        if (stack.includes(id)) return 0;
        const skill = progress.skillById(id);
        if (!skill || !skill.prerequisites.length) return (depths[id] = 0);
        return (depths[id] = 1 + Math.max(...skill.prerequisites.map((pre) => depthOf(pre, [...stack, id]))));
      };
      progress.skills.forEach((skill) => depthOf(skill.id));
      const total = progress.skills.length;
      const mastered = progress.skills.filter((s) => progress.masteryFor(s.id, data) >= 80).length;
      const avg = Math.round(progress.skills.reduce((sum, s) => sum + progress.masteryFor(s.id, data), 0) / Math.max(1, total));
      [['★', `${mastered}/${total}`, 'Освоено'], ['◐', `${avg}%`, 'Среднее'], ['◆', `${progress.categorySummary('arithmetic', data).mastery}%`, 'Арифметика'], ['◆', `${progress.categorySummary('algebra', data).mastery}%`, 'Алгебра'], ['◆', `${progress.categorySummary('geometry', data).mastery}%`, 'Геометрия']].forEach(([ic, val, label]) => {
        const card = document.createElement('div'); card.className = 'board-stat'; card.innerHTML = `<span>${ic} ${label}</span><strong>${val}</strong>`; statsHost.append(card);
      });
      function renderDetail(skill) {
        const summary = data.skills[skill.id] || { xp: 0, attempts: 0, correctAttempts: 0 };
        const mastery = progress.masteryFor(skill.id, data);
        const readiness = progress.readinessFor(skill, data);
        const accuracy = summary.attempts ? Math.round(summary.correctAttempts / summary.attempts * 100) : 0;
        const requirements = skill.prerequisites.length ? skill.prerequisites.map((id) => { const item = progress.skillById(id); const value = progress.masteryFor(id, data); const cross = item && item.category !== skill.category; return `<li><span>${value >= 60 ? '✓' : '○'} ${item ? item.title : id}${cross ? ' (другая ветка)' : ''}</span><strong>${value}%</strong></li>`; }).join('') : '<li><span>★ Стартовая тема</span><strong>—</strong></li>';
        const next = progress.skills.filter((o) => o.prerequisites.includes(skill.id)).slice(0, 6).map((o) => `<span class="req-chip${o.category !== skill.category ? ' cross' : ''}">→ ${o.title}</span>`).join('');
        detail.innerHTML = `<div><p class="eyebrow">Навык · глубина ${depths[skill.id]} · ${categories[skill.category]}</p><h2>${skill.title}</h2><div class="detail-metrics"><div class="detail-metric"><span>Освоение</span><strong>${mastery}%</strong></div><div class="detail-metric"><span>XP</span><strong>${summary.xp || 0}</strong></div><div class="detail-metric"><span>Точность</span><strong>${accuracy}%</strong></div></div><div class="progress-track" style="margin-top:12px"><span style="width:${mastery}%"></span></div><div style="margin:12px 0"><a class="button" href="${progress.hrefForSkill(skill)}">Практиковаться →</a></div><div>${next}</div></div><div><h3>Готовность: ${readiness}%</h3><p class="muted">Что нужно перед этой темой:</p><ul class="requirements">${requirements}</ul></div>`;
      }
      Object.entries(categories).forEach(([category, title]) => {
        const branch = document.createElement('section'); branch.className = 'branch'; branch.dataset.category = category;
        branch.innerHTML = `<h2 class="branch-title">${title}</h2><div class="skill-list"></div>`;
        progress.skills.filter((skill) => skill.category === category).sort((a, b) => depths[a.id] - depths[b.id]).forEach((skill) => {
          const state = progress.stateFor(skill, data); const mastery = progress.masteryFor(skill.id, data);
          const prereqChips = skill.prerequisites.slice(0, 3).map((id) => { const item = progress.skillById(id); const cross = item && item.category !== category; return `<span class="req-chip${cross ? ' cross' : ''}">${cross ? '⇄' : '↑'} ${item ? item.title : id}</span>`; }).join('');
          const button = document.createElement('button'); button.className = `skill-node ${state}`; button.type = 'button';
          button.innerHTML = `<strong>${skill.title}</strong><small>Освоение ${mastery}% · глубина ${depths[skill.id]}${skill.prerequisites.length ? ` · нужно: ${skill.prerequisites.length}` : ' · старт'}</small><div class="mastery-track"><i style="width:${mastery}%"></i></div><div class="node-sub"><span>${mastery}%</span><span>d${depths[skill.id]}</span></div><div>${prereqChips}</div><span class="state">${icon[state]}</span>`;
          button.addEventListener('click', () => renderDetail(skill));
          branch.querySelector('.skill-list').append(button);
        });
        branchHost.append(branch);
      });
      const algebraDefault = progress.skillById('powers') || progress.skills[0];
      renderDetail(algebraDefault);
    })();
  </script>

</body>
</html>
